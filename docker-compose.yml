services:
  db:
    image: postgres:16-alpine
    container_name: qsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qsm_user
      POSTGRES_PASSWORD: qsm_secret_password
      POSTGRES_DB: qsm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsm_user -d qsm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: qsm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://qsm_user:qsm_secret_password@db:5432/qsm_db
    ports:
      - "8000:8000"

volumes:
  pgdata: