services:
  db:
    image: postgres:16-alpine
    container_name: qsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qsm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsm_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-qsm_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qsm_user} -d ${POSTGRES_DB:-qsm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: qsm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qsm_user}:${POSTGRES_PASSWORD:-qsm_secret_password}@db:5432/${POSTGRES_DB:-qsm_db}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/info')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: